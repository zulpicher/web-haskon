services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: haskon_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      db:
        condition: service_healthy
    networks:
      - haskon

  db:
    image: mysql:8.0
    container_name: haskon_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: haskon_db
    ports:
      - "3307:3306"
    volumes:
      - haskon_db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-psecret"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - haskon

  nginx:
    image: nginx:alpine
    container_name: haskon_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - haskon

  node:
    image: node:20
    container_name: haskon_node
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - haskon_node_modules:/var/www/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - haskon

networks:
  haskon:

volumes:
  haskon_db_data:
  haskon_node_modules:
